name: build-ps4

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feat/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OpenOrbis PS4 toolchain v0.5.4
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/tc.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p "$HOME/tc"
          tar -xzf /tmp/tc.tar.gz -C "$HOME/tc"
          echo "--- Baum ---"
          find "$HOME/tc" -maxdepth 3 | head -40

      - name: Locate toolchain root and LLVM bin
        run: |
          set -uxo pipefail
          echo "--- Kandidaten (Symlinks inklusive) ---"
          find "$HOME/tc" \( -name 'clang*' -o -name 'ld.lld*' -o -name 'link.x' -o -name 'crt1.o' \) 2>/dev/null | head -40

          ROOT=$(dirname "$(find "$HOME/tc" -name 'link.x' 2>/dev/null | head -1)")
          CLANG=$(find "$HOME/tc" -name 'clang' 2>/dev/null | head -1)
          if [ -z "${CLANG:-}" ]; then
            CLANG=$(find "$HOME/tc" -name 'clang-*' 2>/dev/null | head -1)
          fi
          test -n "${ROOT:-}"
          test -n "${CLANG:-}"
          LLVM=$(dirname "$CLANG")

          # Rechte wiederherstellen (tar ohne Modus / kopierte Binaerdateien)
          chmod -R u+x "$ROOT/bin" 2>/dev/null || true
          chmod u+x "$LLVM"/* 2>/dev/null || true
          ls -la "$LLVM" | head -25

          # ld.lld unter kanonischem Namen sicherstellen
          if [ ! -e "$LLVM/ld.lld" ]; then
            LLD=$(find "$HOME/tc" -name 'ld.lld*' 2>/dev/null | head -1)
            if [ -n "${LLD:-}" ]; then ln -sf "$LLD" "$LLVM/ld.lld"; fi
          fi
          ls -la "$LLVM" | grep -E 'clang|ld\.lld' || true

          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
          echo "LLVM_BIN=$LLVM" >> "$GITHUB_ENV"
          echo "CLANG=$LLVM/clang" >> "$GITHUB_ENV"
          echo "LLD=$LLVM/ld.lld" >> "$GITHUB_ENV"
          echo "toolchain root: $ROOT"
          echo "llvm bin:       $LLVM"

      - name: Smoke-test compiler + linker
        working-directory: dropbear
        run: |
          set -euxo pipefail
          export CC="$PWD/build-aux/ps4-clang-wrap.sh"
          "$CC" -c -x c -o /tmp/smoke.o - <<'EOF'
          int ps4_ci_smoke(void) { return 0; }
          EOF
          file /tmp/smoke.o

      - name: Configure (PS4 cross)
        working-directory: dropbear
        run: |
          set -euo pipefail
          cp localoptions-ps4.example.h localoptions.h
          export CC="$PWD/build-aux/ps4-clang-wrap.sh"
          ./configure \
            --host=x86_64-unknown-freebsd9 \
            --build=x86_64-pc-linux-gnu \
            --disable-zlib --disable-pam --disable-syslog \
            --disable-lastlog --disable-utmp --disable-utmpx \
            --disable-wtmp --disable-wtmpx --disable-loginfunc \
            --disable-pututline --disable-pututxline \
            --enable-bundled-libtom --disable-harden \
            ac_cv_func_getusershell=no \
            ac_cv_func_clearenv=no \
            ac_cv_func_daemon=no \
            ac_cv_func_basename=yes \
            ac_cv_func_dirname=yes \
            ac_cv_func_openpty=yes \
            ac_cv_func_fork=yes \
            ac_cv_func_vfork=yes \
            CC="$CC" \
            CFLAGS="-I$OO_PS4_TOOLCHAIN/include -I. -O2 -D__ORBIS__ -D_GNU_SOURCE" \
            LDFLAGS= LIBS= || { echo '--- config.log ---'; tail -60 config.log; exit 1; }

      - name: Build dropbear (multi)
        working-directory: dropbear
        run: make PROGRAMS=dropbear MULTI=1 -j2

      - name: Collect artifacts and hashes
        run: |
          set -euo pipefail
          mkdir -p out
          for f in dropbear/dropbearmulti dropbear/dropbear; do
            if [ -f "$f" ]; then cp "$f" "out/$(basename "$f")"; file "out/$(basename "$f")"; fi
          done
          (cd out && sha256sum * | tee SHA256SUMS)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dropbear-ps4-${{ github.sha }}
          path: |
            out/**
          if-no-files-found: error
          retention-days: 30
